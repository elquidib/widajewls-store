<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Wida Jewls — إدارة الطلبات</title>
<script src="./supabase-config.js"></script>
<style>
:root{--bg:#faf8f3;--ink:#1c1c1c;--muted:#77736c;--line:#e5dccd;--gold:#c9a45c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Tahoma,Arial,system-ui,sans-serif;direction:rtl}
.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.login{max-width:420px;margin:12vh auto}.brand{font-family:Georgia,serif;letter-spacing:.14em;font-size:22px}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:750;background:#171717;color:#fff;cursor:pointer}button:disabled{opacity:.5}.primary{background:#171717}.whatsapp{background:#16834a;color:#fff}.green{background:#18794e}.red{background:#b42318}.soft{background:#f1eadf;color:#171717}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.error{color:#b42318}.hidden{display:none!important}.orders{display:grid;gap:12px}.order h2{font-size:18px;margin:0}.pill{border-radius:99px;padding:5px 9px;background:#f3eadc;font-size:12px;font-weight:800}.status-new{background:#fff2ca}.status-confirmed{background:#e7f2ff}.status-shipped,.status-delivered{background:#e4f5ea}.items{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.item{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.total{font-size:18px;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:105px}.actions a{display:flex;min-width:105px}.small{font-size:12px}.hidden{display:none!important}@media(min-width:700px){.orders{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="wrap login"><div class="card">
<div class="brand">WIDA✦JEWLS</div><h2>تسجيل دخول الموظفة</h2><p class="muted">أدخلي اسم المستخدم والرمز السري المكوّن من 6 أرقام.</p>
<form id="loginForm"><label>اسم المستخدم</label><input id="username" autocomplete="username" required maxlength="24" placeholder="اسم المستخدم"><label>الرمز السري (6 أرقام)</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required placeholder="••••••"><button type="submit" style="width:100%;margin-top:16px">دخول</button><p id="loginError" class="error"></p></form>
</div></div>
<div id="app" class="wrap hidden">
<div class="card row between"><div><div class="brand">WIDA✦JEWLS</div><div class="muted" id="staffName"></div></div><button class="soft" onclick="logout()">تسجيل الخروج</button></div>
<div class="card"><div class="row between"><div><h2 style="margin:0">الطلبات</h2><p class="muted" style="margin:5px 0">يمكنكِ من هنا متابعة الطلبات والتواصل مع الزبونات فقط.</p></div><button class="soft" onclick="loadOrders()">تحديث</button></div>
<div class="row" style="margin-top:12px"><input id="search" placeholder="بحث برقم الطلب أو الاسم أو الهاتف أو المدينة" oninput="renderOrders()" style="flex:2;min-width:190px"><select id="filter" onchange="renderOrders()" style="flex:1;min-width:145px"><option value="">جميع الحالات</option><option value="new">طلب جديد</option><option value="confirmed">تم التأكيد</option><option value="processing">قيد التجهيز</option><option value="shipped">تم الشحن</option><option value="delivered">تم التسليم</option><option value="cancelled">ملغي</option><option value="returned">مرتجع</option></select></div></div>
<div id="orders" class="orders"></div><p id="message" class="muted small"></p>
</div>
<script>
const staffApiUrl = WIDAJEWLS_SUPABASE.url.replace(/\/+$/, '') + '/functions/v1/staff-orders';
let staffSession = sessionStorage.getItem('wida_staff_session') || '';
let staffDisplayName = sessionStorage.getItem('wida_staff_name') || '';
let orders = [];
let busy = false;

const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[char]));

async function api(payload) {
  const headers = {
    'Content-Type': 'application/json',
    'apikey': WIDAJEWLS_SUPABASE.publishableKey
  };
  if (staffSession) headers['x-staff-session'] = staffSession;
  const response = await fetch(staffApiUrl, {
    method: 'POST', headers, body: JSON.stringify(payload), cache: 'no-store'
  });
  const raw = await response.text();
  let data = {};
  try { data = raw ? JSON.parse(raw) : {}; } catch {}
  if (!response.ok || data.error) {
    const error = new Error(data.error || 'Request failed. Please try again.');
    error.status = response.status;
    throw error;
  }
  return data;
}

function clearStaffSession() {
  staffSession = '';
  staffDisplayName = '';
  sessionStorage.removeItem('wida_staff_session');
  sessionStorage.removeItem('wida_staff_name');
}

async function enterStaffApp(name) {
  const result = await api({ action: 'list_orders' });
  staffDisplayName = name || 'Staff';
  sessionStorage.setItem('wida_staff_name', staffDisplayName);
  $('staffName').textContent = staffDisplayName;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  orders = result.orders || [];
  renderOrders();
}

async function expireStaffSession() {
  clearStaffSession();
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginError').textContent = 'انتهت صلاحية الجلسة. المرجو تسجيل الدخول من جديد.';
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('loginError').textContent = '';
  const form = event.currentTarget;
  const button = form.querySelector('button[type="submit"]');
  const username = $('username').value.trim().toLowerCase();
  const pin = $('pin').value.trim();

  if (!/^[a-z0-9._-]{3,24}$/.test(username) || !/^\d{6}$/.test(pin)) {
    $('loginError').textContent = 'أدخلي اسم المستخدم والرمز السري المكوّن من 6 أرقام.';
    return;
  }

  button.disabled = true;
  button.textContent = 'جارٍ الدخول…';
  try {
    const result = await api({ action: 'login_pin', username, pin });
    staffSession = result.token;
    sessionStorage.setItem('wida_staff_session', staffSession);
    await enterStaffApp(result.staff?.display_name || username);
    $('pin').value = '';
  } catch (error) {
    clearStaffSession();
    $('loginError').textContent = 'اسم المستخدم أو الرمز السري غير صحيح، أو الحساب موقوف مؤقتاً.';
  } finally {
    button.disabled = false;
    button.textContent = 'دخول';
  }
});

async function loadOrders() {
  if (busy) return;
  busy = true;
  $('message').textContent = 'جارٍ تحميل الطلبات…';
  try {
    const result = await api({ action: 'list_orders' });
    orders = result.orders || [];
    renderOrders();
    $('message').textContent = 'تم تحديث الطلبات الآن.';
  } catch (error) {
    if (error.status === 401) return await expireStaffSession();
    $('message').textContent = 'تعذر إتمام العملية. حاولي مرة أخرى.';
  } finally {
    busy = false;
  }
}

function normalizeMoroccanPhone(value) {
  let phone = String(value || '').replace(/[^\d]/g, '');
  if (phone.startsWith('00')) phone = phone.slice(2);
  if (phone.startsWith('0') && phone.length === 10) phone = '212' + phone.slice(1);
  else if (phone.length === 9 && /^[5-7]/.test(phone)) phone = '212' + phone;
  return phone;
}

function whatsappMessage(order) {
  const name = String(order.customer_name || '').trim() || 'عزيزتي الزبونة';
  const number = order.order_number || order.id || '';
  const itemLines = (order.order_items || []).map(item =>
    '• ' + String(item.product_name || 'منتج') +
    (item.variant_name ? ' - ' + String(item.variant_name) : '') +
    ' × ' + String(item.quantity || 1)
  ).join('\n');
  const total = Number(order.total || 0).toFixed(2);
  if (order.status === 'new') {
    return 'السلام عليكم ' + name + ' 🌷\n' +
      'معكِ فريق Wida Jewls. توصلنا بطلبك رقم #' + number + '، وبغينا غير نتأكدو واش ما زال بغيتيه.\n\n' +
      '🛍️ تفاصيل الطلب:\n' + (itemLines || 'طلبك المسجل عندنا') + '\n' +
      '💰 المبلغ عند الاستلام: ' + total + ' درهم\n' +
      '📍 المدينة: ' + String(order.city || 'غير محددة') + '\n' +
      '🏠 العنوان: ' + String(order.address || 'يرجى تأكيد العنوان') + '\n\n' +
      'واش نأكدو ليك الطلب ونوجدوه للإرسال؟ 😊\n' +
      'المرجو الرد بـ «نعم، أؤكد الطلب» أو «إلغاء الطلب».\n' +
      'شكراً على ثقتك في Wida Jewls 💛';
  }
  return 'السلام عليكم ' + name + ' 🌷\n' +
    'شكراً على تأكيدك للطلب رقم #' + number + ' من Wida Jewls 💛\n\n' +
    '✅ تم تأكيد طلبك بنجاح، والتوصيل متوقع خلال يوم إلى يومين إن شاء الله.\n' +
    '📦 المبلغ عند الاستلام: ' + total + ' درهم.\n\n' +
    'عافاك خليكِ متاحة فهاد الرقم، وخلي الهاتف قريب منك، حيث ممكن يتاصل بكِ الموزع قبل ما يوصل.\n' +
    'شكراً لاختيارك Wida Jewls 🌸';
}

function openOrderWhatsApp(orderId) {
  const order = orders.find(item => item.id === orderId);
  if (!order) return;
  const phone = normalizeMoroccanPhone(order.phone);
  if (!phone) {
    $('message').textContent = 'رقم الهاتف غير صالح أو غير متوفر لهذا الطلب.';
    return;
  }
  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(whatsappMessage(order));
  window.open(url, '_blank', 'noopener,noreferrer');
}

function statusLabel(status) {
  return ({
    new:'طلب جديد', confirmed:'تم التأكيد', processing:'قيد التجهيز',
    shipped:'تم الشحن', delivered:'تم التسليم', cancelled:'ملغي', returned:'مرتجع'
  })[status] || status || 'غير محدد';
}

function renderOrders() {
  const query = $('search').value.trim().toLowerCase();
  const filter = $('filter').value;
  const rows = orders.filter(order =>
    (!filter || order.status === filter) &&
    [order.order_number, order.customer_name, order.phone, order.city].join(' ').toLowerCase().includes(query)
  );

  $('orders').innerHTML = rows.map(order => {
    const items = (order.order_items || []).map(item =>
      '<div class="item"><span>' + esc(item.product_name) +
      (item.variant_name ? ' · ' + esc(item.variant_name) : '') +
      ' × ' + esc(item.quantity) + '</span><b>' +
      Number(item.line_total || 0).toFixed(2) + ' درهم</b></div>'
    ).join('');
    const phone = String(order.phone || '').replace(/[^0-9+]/g, '');
    const waButton = ['new','confirmed'].includes(order.status)
      ? '<button class="whatsapp" onclick="openOrderWhatsApp(\'' + order.id + '\')">' +
        (order.status === 'new' ? 'واتساب: طلب تأكيد الطلب' : 'واتساب: إرسال تأكيد الطلب') + '</button>'
      : '';
    const actions = order.status === 'new'
      ? '<button class="green" onclick="handleOrder(\'' + order.id + '\',\'confirm\')">تأكيد في النظام</button>' +
        '<button class="soft" onclick="handleOrder(\'' + order.id + '\',\'call_later\')">تذكير بالاتصال</button>' +
        '<button class="red" onclick="handleOrder(\'' + order.id + '\',\'cancel\')">إلغاء</button>'
      : order.status === 'confirmed'
        ? '<button class="soft" onclick="handleOrder(\'' + order.id + '\',\'call_later\')">تذكير بالاتصال</button>'
        : '';

    return '<article class="card order">' +
      '<div class="row between"><h2>الطلب رقم #' + esc(order.order_number) + '</h2>' +
      '<span class="pill status-' + esc(order.status) + '">' + esc(statusLabel(order.status)) + '</span></div>' +
      '<p style="margin:9px 0 4px"><b>' + esc(order.customer_name) + '</b></p>' +
      '<div class="muted">' + esc(order.phone) + ' · ' + esc(order.city || '') + '</div>' +
      '<p style="margin:8px 0">' + esc(order.address || '') + '</p>' +
      '<div class="items">' + (items || '<span class="muted">لا توجد تفاصيل للمنتجات</span>') + '</div>' +
      '<div class="row between" style="margin-top:12px"><span class="muted">المبلغ عند الاستلام</span>' +
      '<span class="total">' + Number(order.total || 0).toFixed(2) + ' درهم</span></div>' +
      '<div class="actions"><a href="tel:' + esc(phone) + '" style="flex:1;text-decoration:none">' +
      '<button class="soft" style="width:100%">اتصال بالزبونة</button></a>' + waButton + actions + '</div></article>';
  }).join('') || '<div class="card muted">لا توجد طلبات مطابقة لهذا البحث.</div>';
}

async function handleOrder(id, operation) {
  if (busy) return;
  const labels = {
    confirm: 'هل أكدت الزبونة الطلب عبر واتساب أو الهاتف؟',
    cancel: 'هل تريدين إلغاء هذا الطلب؟',
    call_later: 'هل تريدين إضافة تذكير للاتصال بالزبونة بعد ساعتين؟'
  };
  if (!confirm(labels[operation])) return;
  busy = true;
  $('message').textContent = 'جارٍ حفظ التغيير…';
  try {
    await api({ action: 'handle_order', order_id: id, operation });
    busy = false;
    await loadOrders();
    $('message').textContent = 'تم تحديث الطلب بنجاح ✓';
  } catch (error) {
    if (error.status === 401) await expireStaffSession();
    else $('message').textContent = error.message;
  } finally {
    busy = false;
  }
}

async function logout() {
  try {
    if (staffSession) await api({ action: 'logout_pin' });
  } catch {}
  clearStaffSession();
  location.reload();
}

(async () => {
  if (!staffSession) return;
  try {
    await enterStaffApp(staffDisplayName);
  } catch {
    clearStaffSession();
  }
})();
</script>
</body></html>
