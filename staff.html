<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>WIDA JEWLS | فريق الطلبات</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="./supabase-config.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#171717;--muted:#777;--line:#e9e5de;--green:#147849;--red:#b42318;--amber:#946200}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif}button,input{font:inherit}button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;cursor:pointer;min-height:46px}button:disabled{opacity:.5}.wrap{max-width:720px;margin:auto;padding:16px 13px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px}.brand{font-weight:950;letter-spacing:.08em;font-size:19px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 3px 14px #00000005}h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.primary{background:#111;color:#fff;width:100%;margin-top:15px}.soft{background:#eeeae3;color:#222}.error{color:var(--red);font-size:13px}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;background:#ebe8e1;color:#333}.tab.active{background:#111;color:#fff}.toolbar{display:flex;gap:8px;align-items:center}.toolbar input{flex:1;min-width:0}.count{font-size:12px;color:var(--muted);white-space:nowrap}.orderhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.repeat-badge{display:inline-flex;align-items:center;gap:4px;background:#e4f3e8;color:#187343;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:900;white-space:nowrap}.pill{background:#fff3d1;color:#795500;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.name{font-size:21px;font-weight:900;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info{background:#faf9f6;border:1px solid var(--line);border-radius:11px;padding:10px;min-width:0}.info small{display:block;color:var(--muted);font-size:11px}.info b{font-size:14px;overflow-wrap:anywhere}.wide{grid-column:1/-1}.items{border-top:1px solid var(--line);margin-top:13px;padding-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px}.total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px;margin-top:6px;font-size:18px;font-weight:900}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.link{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:900;min-height:46px}.call{background:#eaf5ee;color:#176b42}.wa{background:#e9f7ee;color:#087443}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.confirm{background:#147849;color:#fff}.cancel{background:#fff0ee;color:#ad261d}.later{grid-column:1/-1;background:#fff4d7;color:#805600}.empty{text-align:center;color:var(--muted);padding:28px 10px}.date-shortcuts{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.date-input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin:5px 0 12px}@media(max-width:390px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions{grid-template-columns:1fr}.later{grid-column:auto}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">WIDA✦JEWLS</div><div class="muted">لوحة فريق تأكيد الطلبات</div></div><button id="logout" class="soft hidden">خروج</button></header>
<section id="login" class="card"><h1>مرحباً بك 🌸</h1><p class="muted">دخلي اسم المستخدم والرمز السري ديالك.</p><form id="loginForm"><label>اسم المستخدم</label><input id="username" autocomplete="username" required minlength="3"><label>PIN — ستة أرقام</label><input id="pin" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" maxlength="6" required><button class="primary" id="loginBtn">دخول</button><p id="loginError" class="error" aria-live="polite"></p></form></section>
<main id="app" class="hidden"><section class="card"><div class="toolbar"><div style="flex:1"><b id="staffName">فريق الطلبات</b><div class="muted">اختاري الطلب وتواصلي مع الزبونة</div></div><button id="exportConfirmed" class="soft">تحميل الطلبات المؤكدة Excel</button><button id="refresh" class="soft">تحديث</button></div></section>
<div class="toolbar"><input id="search" placeholder="بحث برقم الطلب أو الاسم أو الهاتف..." aria-label="بحث"><span id="resultCount" class="count"></span></div>
<div class="date-shortcuts"><button class="tab active" data-day="today">اليوم</button><button class="tab" data-day="yesterday">الأمس</button><button class="tab" data-day="all">كل التواريخ</button></div><label for="orderDate">اختيار تاريخ محدد</label><input id="orderDate" type="date" class="date-input">
<nav class="tabs" id="tabs"><button class="tab active" data-status="new">جديدة</button><button class="tab" data-status="confirmed">مؤكدة</button><button class="tab" data-status="cancelled">ملغاة</button><button class="tab" data-status="follow">اتصال لاحقاً</button><button class="tab" data-status="all">جميع الطلبات</button></nav>
<div id="message" class="muted" aria-live="polite"></div><div id="orders"></div></main></div>
<script>
(()=>{const cfg=window.WIDAJEWLS_SUPABASE;if(!cfg){document.getElementById('loginError').textContent='تعذر الاتصال بالخدمة.';return}const endpoint=cfg.url.replace(/\/+$/,'')+'/functions/v1/staff-orders';const $=id=>document.getElementById(id);let staffSession=sessionStorage.getItem('wida_staff_session')||'',staffName=sessionStorage.getItem('wida_staff_name')||'',orders=[],followups=[],tab='new',busy=false,dayMode='today';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('fr-MA',{maximumFractionDigits:2})+' DH';
async function api(data,auth=staffSession){const headers={'Content-Type':'application/json','apikey':cfg.publishableKey};if(auth)headers['x-staff-session']=auth;const r=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(data),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok||j.error){const e=new Error(j.error||'تعذر تنفيذ العملية');e.status=r.status;throw e}return j}
function phone(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00212'))d=d.slice(5);else if(d.startsWith('212'))d=d.slice(3);if(/^0[5-7]\d{8}$/.test(d))return '212'+d.slice(1);if(/^[5-7]\d{8}$/.test(d))return '212'+d;return ''}
function phoneKey(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00212'))d=d.slice(5);else if(d.startsWith('212'))d=d.slice(3);if(d.length===10&&d.startsWith('0'))d=d.slice(1);return d.length===9?d:''}
function repeatOrderCount(o){const key=phoneKey(o.phone);return key?orders.filter(x=>phoneKey(x.phone)===key).length:1}
function localDate(v){return v?new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Casablanca',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v)):''}
function shiftDate(key,offset){const [y,m,d]=key.split('-').map(Number);const x=new Date(Date.UTC(y,m-1,d+offset));return x.toISOString().slice(0,10)}
function selectedDate(){if($('orderDate').value)return $('orderDate').value;if(dayMode==='all')return '';const today=localDate(new Date().toISOString());return dayMode==='yesterday'?shiftDate(today,-1):today}
function waUrl(o,type){const p=phone(o.phone);if(!p)return '#';const item=(o.order_items||[]).map(i=>i.product_name+' × '+i.quantity).join('، ')||'الطلب ديالك';let msg='';if(type==='new')msg='سلام '+(o.customer_name||'')+'، معاك Wida Jewls.\n\nطلبك: '+item+'\nالثمن: '+money(o.total)+'\n\nواش نأكدو الطلب؟\n✅ نعم، تأكيد\n❌ إلغاء\n\nشكراً على ثقتك فينا ❤️';else if(type==='confirmed')msg='❤️ طلبك تأكد بنجاح مع Wida Jewels!\n\n🚚 التوصيل خلال 1 إلى 2 أيام إن شاء الله.\n\nخليك قريب من هاتفك باش تكون على تواصل مع الموزع.\n\nشكراً على ثقتك فينا ❤️';else msg='سلام '+(o.customer_name||'')+' ❤️\n\nطلبك من Wida Jewls خرج للتوصيل 🚚\n\nخلي تلفونك قريب منك وجاوبي على اتصال الموزع باش تستلمي الطلب.\n\nشكراً على ثقتك فينا 🌸';return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg)}
function statusLabel(s){return ({new:'طلب جديد',confirmed:'تم التأكيد',processing:'قيد التجهيز',shipped:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغى',returned:'مرتجع'})[s]||s||'غير محدد'}
function normalizeLadyLogPhone(value){let digits=String(value??'').replace(/\D/g,'');if(digits.startsWith('00'))digits=digits.slice(2);if(digits.startsWith('212')&&digits.length===12)digits='0'+digits.slice(3);if((digits.startsWith('6')||digits.startsWith('7'))&&digits.length===9)digits='0'+digits;return digits.length===10&&/^0[67]\d{8}$/.test(digits)?digits:''}
function exportConfirmedLadyLog(){const confirmed=orders.filter(o=>o.status==='confirmed');if(!confirmed.length){alert('ما كاين حتى طلب مؤكد لتحميله.');return}if(typeof XLSX==='undefined'){alert('تعذر تحميل مكتبة Excel. حدّثي الصفحة وحاولي مرة أخرى.');return}const headers=['CODE SUIVI','DESTINATAIRE','TELEPHONE','ADRESSE','PRIX','VILLE','COMMENTAIRE','MARCHANDISE','QTY','PEUT OUVRIR','COLIS REMPLACER'];const rows=confirmed.map(o=>{const oi=o.order_items||[];const merchandise=oi.map(i=>String(i.product_name||'Article')+(i.variant_name?' ('+String(i.variant_name)+')':'')+' x'+Number(i.quantity||1)).join(' ; ');const qty=oi.reduce((sum,i)=>sum+Number(i.quantity||0),0);return ['',String(o.customer_name||''),normalizeLadyLogPhone(o.phone),String(o.address||''),Number(o.total||0),String(o.city||''),[o.notes||'','Commande Wida #'+o.order_number].filter(Boolean).join(' | '),merchandise,qty,'Non','Non']});const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);ws['!cols']=[{wch:16},{wch:28},{wch:18},{wch:38},{wch:12},{wch:20},{wch:30},{wch:45},{wch:8},{wch:15},{wch:18}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Colis');XLSX.writeFile(wb,'Wida_LadyLog_confirmed_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function render(){const q=$('search').value.trim().toLowerCase(),date=selectedDate();const followIds=new Set(followups.filter(f=>f.workflow_status==='call_later').map(f=>String(f.order_id)));const list=orders.filter(o=>(tab==='follow'?followIds.has(String(o.id)):(!date||localDate(o.created_at)===date)&&(tab==='all'||o.status===tab)&&!(tab==='new'&&followIds.has(String(o.id))))&&(!q||[o.order_number,o.customer_name,o.phone,o.city].join(' ').toLowerCase().includes(q)));$('resultCount').textContent=list.length+' طلب';$('orders').innerHTML=list.length?list.map(o=>{const isNew=o.status==='new',waType=o.status==='new'?'new':o.status==='confirmed'?'confirmed':'shipped';const waLabel=o.status==='new'?'WhatsApp · مراجعة وإرسال':o.status==='confirmed'?'WhatsApp · رسالة التأكيد':'WhatsApp · رسالة للزبونة';const follow=followups.find(f=>String(f.order_id)===String(o.id)&&f.workflow_status==='call_later');const followInfo=tab==='follow'&&follow?'<div class="note" style="background:#fff4d7;color:#805600;border-radius:11px;padding:11px;margin-top:10px">موعد إعادة الاتصال: '+esc(follow.follow_up_at?new Date(follow.follow_up_at).toLocaleString('fr-MA',{timeZone:'Africa/Casablanca'}):'قريباً')+'</div>':'';const actions=tab==='follow'?'<div class="actions"><button class="confirm" data-action="clear_call_later" data-id="'+esc(o.id)+'">تم التواصل — رجوع للطلبات</button></div>':isNew?'<div class="actions"><button class="confirm" data-action="confirm" data-id="'+esc(o.id)+'">✓ تأكيد</button><button class="cancel" data-action="cancel" data-id="'+esc(o.id)+'">إلغاء</button><button class="later" data-action="call_later" data-id="'+esc(o.id)+'">اتصال لاحقاً</button></div>':o.status==='confirmed'?'<div class="actions"><button class="later" data-action="call_later" data-id="'+esc(o.id)+'">اتصال لاحقاً</button></div>':'';return '<article class="card"><div class="orderhead"><b class="muted">طلب #'+esc(o.order_number)+'</b>'+(repeatOrderCount(o)>1?'<span class="repeat-badge" title="عدد الطلبات من نفس رقم الهاتف">↻ '+repeatOrderCount(o)+'</span>':'')+'<span class="pill">'+esc(statusLabel(o.status))+'</span></div><div class="muted" style="font-size:12px;margin-bottom:8px">تاريخ الطلب: '+esc(localDate(o.created_at))+'</div><div class="name">'+esc(o.customer_name)+'</div><div class="grid"><div class="info"><small>الهاتف</small><b dir="ltr">'+esc(o.phone||'—')+'</b></div><div class="info"><small>المدينة</small><b>'+esc(o.city||'—')+'</b></div><div class="info wide"><small>العنوان</small><b>'+esc(o.address||'—')+'</b></div></div><div class="items">'+((o.order_items||[]).map(i=>'<div class="item"><span>'+esc(i.product_name)+(i.variant_name?' · '+esc(i.variant_name):'')+' × '+esc(i.quantity)+'</span><b>'+money(i.line_total)+'</b></div>').join('')||'<span class="muted">تفاصيل المنتجات غير متوفرة</span>')+'</div><div class="total"><span>المجموع</span><span>'+money(o.total)+'</span></div><div class="links"><a class="link call" href="tel:'+esc(phone(o.phone))+'">☎ اتصال</a><a class="link wa" target="_blank" rel="noopener" href="'+esc(waUrl(o,waType))+'">'+waLabel+'</a></div>'+followInfo+actions+'</article>'}).join(''):'<section class="card empty">ما كاين حتى طلب فهاد اللائحة حالياً.</section>'}
async function load(){if(busy)return;busy=true;$('message').textContent='جاري تحديث الطلبات…';try{const d=await api({action:'list_orders'});orders=d.orders||[];followups=d.followups||[];if(d.staff?.display_name){staffName=d.staff.display_name;sessionStorage.setItem('wida_staff_name',staffName);$('staffName').textContent=staffName}render();$('message').textContent='آخر تحديث: '+new Date().toLocaleTimeString('fr-MA')}catch(e){if(e.status===401){await expire();return}$('message').textContent=e.message}finally{busy=false}}
async function enter(){try{const d=await api({action:'list_orders'});orders=d.orders||[];$('staffName').textContent=staffName||d.staff?.display_name||'فريق الطلبات';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render();$('message').textContent='تم تسجيل الدخول بنجاح'}catch(e){if(e.status===401)clearSession();$('loginError').textContent=e.message}}
function clearSession(){staffSession='';staffName='';sessionStorage.removeItem('wida_staff_session');sessionStorage.removeItem('wida_staff_name')}
async function expire(){clearSession();$('app').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');$('loginError').textContent='انتهت الجلسة. دخلي من جديد.'}
function logout(){if(staffSession)api({action:'logout_pin'}).catch(()=>{});clearSession();location.reload()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='';try{const d=await api({action:'login_pin',username:$('username').value.trim().toLowerCase(),pin:$('pin').value},'');staffSession=d.token;staffName=d.staff?.display_name||$('username').value;sessionStorage.setItem('wida_staff_session',staffSession);sessionStorage.setItem('wida_staff_name',staffName);$('pin').value='';await enter()}catch(err){$('loginError').textContent=err.message}finally{$('loginBtn').disabled=false}});
$('logout').addEventListener('click',logout);$('refresh').addEventListener('click',load);$('exportConfirmed').addEventListener('click',exportConfirmedLadyLog);$('search').addEventListener('input',render);
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{dayMode=b.dataset.day;$('orderDate').value='';document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x===b));render()}));
$('orderDate').addEventListener('change',()=>{dayMode='custom';document.querySelectorAll('[data-day]').forEach(x=>x.classList.remove('active'));render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-status]');if(!b)return;tab=b.dataset.status;document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('orders').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const action=b.dataset.action,id=b.dataset.id;const prompts={confirm:'واش تأكد هاد الطلب مع الزبونة؟',cancel:'واش متأكدة بغيتي تلغي هاد الطلب؟',call_later:'نضيفو هاد الطلب للاتصال لاحقاً؟',clear_call_later:'واش تواصلتي مع الزبونة؟ نرجعو الطلب للائحة العادية؟'};if(!confirm(prompts[action]))return;const order=orders.find(o=>String(o.id)===String(id));if(action==='confirm'&&order){const url=waUrl(order,'confirmed');if(url!=='#')window.open(url,'_blank','noopener,noreferrer')}busy=true;b.disabled=true;try{await api({action:'handle_order',order_id:id,operation:action});busy=false;await load();if(action==='call_later'){tab='follow';document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('active',x.dataset.status==='follow'));render()}$('message').textContent=action==='confirm'?'تأكد الطلب، ورسالة التأكيد واجدة فـ WhatsApp.':action==='call_later'?'تضاف الطلب للائحة الاتصال لاحقاً.':'تم حفظ التغيير.'}catch(err){$('message').textContent=err.message}finally{busy=false}});
if(staffSession)enter();
})();
</script></body></html>
