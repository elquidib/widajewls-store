function languageSwitcher(){
  const l=WIDAJEWLS_LANGUAGES[currentLanguage]||WIDAJEWLS_LANGUAGES.en;
  return '<div class="language-switcher" onclick="event.stopPropagation()"><button class="language-trigger" type="button" aria-haspopup="true" aria-expanded="false" onclick="toggleLanguageMenu(event)"><span class="language-flag flag-'+l.flag+'"></span><span class="language-label">'+l.label+'</span><span class="language-chevron">⌄</span></button><div class="language-menu" id="languageMenu" role="menu" aria-hidden="true">'+Object.entries(WIDAJEWLS_LANGUAGES).filter(([code])=>code!==currentLanguage).map(([code,x])=>'<button type="button" class="language-option" onclick="setLanguage(\''+code+'\')" role="menuitem"><span class="language-flag flag-'+x.flag+'"></span><span>'+x.label+'</span></button>').join('')+'</div></div>';
}
function toggleLanguageMenu(event){
  event?.stopPropagation();
  const menu=document.getElementById("languageMenu"),trigger=document.querySelector(".language-trigger");
  if(!menu)return;
  const open=!menu.classList.contains("open");
  menu.classList.toggle("open",open); menu.setAttribute("aria-hidden",open?"false":"true");
  if(trigger)trigger.setAttribute("aria-expanded",open?"true":"false");
}
function closeLanguageMenu(){
  const menu=document.getElementById("languageMenu"),trigger=document.querySelector(".language-trigger");
  if(menu){menu.classList.remove("open");menu.setAttribute("aria-hidden","true")}
  if(trigger)trigger.setAttribute("aria-expanded","false");
}
function setLanguage(code){
  if(!WIDAJEWLS_LANGUAGES[code])return;
  currentLanguage=code;
  localStorage.setItem("widajewls-language",code);
  closeLanguageMenu();
  render();
  updateSEO();
}
function translateString(value){
  const dict=WIDAJEWLS_TRANSLATIONS[currentLanguage]||{};
  return Object.prototype.hasOwnProperty.call(dict,value)?dict[value]:value;
}
function applyLanguage(){
  const meta=WIDAJEWLS_LANGUAGES[currentLanguage]||WIDAJEWLS_LANGUAGES.en;
  document.documentElement.lang=currentLanguage;
  document.documentElement.dir=meta.dir;
  document.body.classList.remove("lang-en","lang-fr","lang-ar");
  document.body.classList.add("lang-"+currentLanguage);
  document.title=currentLanguage==="fr"?"Wida Jewls — Bijoux":currentLanguage==="ar"?"Wida Jewls — وشوم مؤقتة":"Wida Jewls — Jewelry";
  const root=document.getElementById("app");
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(node.parentElement?.closest("script,style,.language-switcher,[data-brand-name]"))return;
    const raw=node.nodeValue||"",trim=raw.trim();
    if(!trim)return;
    const translated=translateString(trim);
    if(translated!==trim)node.nodeValue=raw.replace(trim,translated);
  });
  const attrMap={"Search":"Rechercher","Cart":"Panier","Your email":"Votre e-mail","Search jewelry…":"Rechercher un tatouage…","Your name":"Votre nom","06 XX XX XX XX":"06 XX XX XX XX","Agadir":"Agadir","Hay / quartier":"Hay / quartier","Optional note":"Note facultative"};
  const arAttr={"Search":"بحث","Cart":"السلة","Your email":"بريدك الإلكتروني","Search jewelry…":"ابحث عن وشم…","Your name":"اسمك","06 XX XX XX XX":"06 XX XX XX XX","Agadir":"أكادير","Hay / quartier":"الحي / المنطقة","Optional note":"ملاحظة اختيارية"};
  const attrs=currentLanguage==="fr"?attrMap:currentLanguage==="ar"?arAttr:{};
  root.querySelectorAll("input,textarea,button").forEach(el=>{
    ["placeholder","aria-label","title"].forEach(a=>{const v=el.getAttribute(a);if(v&&attrs[v])el.setAttribute(a,attrs[v])});
  });
}

function fastSupabaseImage(src,quality=75){
  const value=String(src||"").trim();
  if(!value)return NO_IMAGE;
  try{
    const u=new URL(value);
    if(u.hostname.endsWith("supabase.co")&&u.pathname.includes("/storage/v1/object/public/")){
      u.pathname=u.pathname.replace("/storage/v1/object/public/","/storage/v1/render/image/public/");
      u.search="?quality="+quality;
      return u.toString();
    }
  }catch(e){}
  return value;
}
function fastProductImage(src){return fastSupabaseImage(src,75)}
function fastSiteImage(src){return fastSupabaseImage(src,72)}
function localizedAnnouncement(){
  const value=String(siteSettings.announcement_text||"").trim();
  const normalized=value.toLowerCase().replace(/\\s+/g," ");
  if(normalized.includes("free delivery")&&normalized.includes("160")){
    if(currentLanguage==="fr")return "Livraison gratuite dès 160 DH";
    if(currentLanguage==="ar")return "التوصيل مجاني ابتداءً من 160 درهم";
    return "Free delivery on orders of 160 DH or more";
  }
  return translateString(value||"Cash on delivery in Morocco");
}

function stableProductId(uuid){let h=0;for(const ch of String(uuid||'')){h=((h<<5)-h)+ch.charCodeAt(0);h|=0}return Math.abs(h)+100}
async function syncStorefrontProductImages(){
  try{
    const [pr,sr,rr,pc,cr]=await Promise.all([
      supabaseRest("products?select=id,name,price,compare_at_price,description,stock,status,bestseller,is_new,is_promo,badge,color,tags,image_urls,seo_title,seo_description,created_at&status=eq.active&order=created_at.desc"),
      supabaseRest("site_settings?select=announcement_text,logo_url,store_name,instagram_url,facebook_url,tiktok_url,hero_desktop_url,hero_mobile_url,hero_title,hero_subtitle,hero_button_text,story_desktop_url,story_image_url,story_mobile_url,shipping_fee&id=eq.true&limit=1"),
      supabaseRest("reviews?select=product_id,rating,review_text,customer_name,approved,created_at&approved=eq.true&order=created_at.desc"),
      supabaseRest("product_collections?select=product_id,collection_id"),
      supabaseRest("collections?select=id,name,slug,status,sort_order&status=eq.active&order=sort_order.asc")
    ]);
    const oldByName=new Map(products.map(p=>[p.name,p]));
    siteSettings={...siteSettings,...(sr[0]||{})};
    shippingFee=Math.max(0,Number(siteSettings.shipping_fee??20));
    reviews=Array.isArray(rr)?rr:[];
    storeCollections=Array.isArray(cr)?cr:[];
    const collectionNames=new Map(storeCollections.map(x=>[x.id,x.name]));
    const productCollectionMap=new Map();
    (Array.isArray(pc)?pc:[]).forEach(x=>{
      const name=collectionNames.get(x.collection_id);
      if(name){
        const arr=productCollectionMap.get(x.product_id)||[];
        arr.push(name);
        productCollectionMap.set(x.product_id,arr);
      }
    });
    products=(Array.isArray(pr)?pr:[]).map(row=>{
      const old=oldByName.get(row.name)||{};
      return normalizeProductImages({
        ...old,id:old.id??stableProductId(row.id),dbId:row.id,name:row.name,
        price:Number(row.price||0),
        compare_at_price:row.compare_at_price==null?null:Number(row.compare_at_price),
        description:row.description||"",desc:row.description||"",
        stock:Number(row.stock||0),status:row.status,bestseller:!!row.bestseller,
        is_new:!!row.is_new,is_promo:!!row.is_promo,badge:row.badge||"",
        color:row.color||"Black",tags:Array.isArray(row.tags)?row.tags:[],
        images:Array.isArray(row.image_urls)?row.image_urls.filter(Boolean).map(src=>({src,pos:"center"})):(old.images||[]),
        seo_title:row.seo_title||"",seo_description:row.seo_description||"",
        collections:productCollectionMap.get(row.id)||[],
        cat:old.cat||((row.tags||[]).find(t=>["symbol","dragon","wings","numbers","script"].includes(String(t).toLowerCase()))||"Jewelry")
      });
    });
    cacheStorefrontData();
    render();
  }catch(e){
    console.warn("Could not sync storefront catalog",e);
    products.forEach(normalizeProductImages);
    render();
  }
}

sticky-buy" onclick="buyNow(${p.id})">ORDER NOW</button></div></div></main>${footer()}</div>`;

function isValidMoroccanPhone(value){const raw=String(value||"").trim().replace(/[\\s().-]/g,"");return /^(?:0[567][0-9]{8}|\\+212[567][0-9]{8}|00212[567][0-9]{8})$/.test(raw)}

async function submitOrder(e){e.preventDefault();const form=e.target;const requiredFields=[...form.querySelectorAll('[data-required="true"]')];requiredFields.forEach(el=>{el.classList.remove('checkout-field-error');el.setAttribute("aria-invalid","false");const label=el.closest('.field')?.querySelector('label');if(label)label.classList.remove('field-error-label')});const missing=requiredFields.find(el=>!String(el.value||'').trim());if(missing){const field=missing.closest('.field');missing.classList.add('checkout-field-error');const label=field?.querySelector('label');if(label)label.classList.add('field-error-label');missing.focus();return}const phoneInput=form.querySelector('input[name="phone"]');if(!validateCheckoutPhone(phoneInput,true)){return}const data=new FormData(form),btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Placing order…';try{if(!cart.length)throw new Error('Your cart is empty.');const name=String(data.get('name')||'').trim(),phone=String(data.get('phone')||'').trim(),city=String(data.get('city')||'').trim(),area=String(data.get('area')||'').trim(),note=String(data.get('note')||'').trim();const items=cart.map(r=>{const p=products.find(x=>x.id===r.id);if(!p||!p.dbId)throw new Error('A product in your cart is no longer available.');return{product_id:p.dbId,quantity:Number(r.qty)}});const checkoutKey=sessionStorage.getItem('widajewls-checkout-key')||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('widajewls-'+Date.now()+'-'+Math.random().toString(36).slice(2)));sessionStorage.setItem('widajewls-checkout-key',checkoutKey);const purchaseEventId=sessionStorage.getItem('widajewls-purchase-event-id')||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('purchase-'+Date.now()+'-'+Math.random().toString(36).slice(2)));sessionStorage.setItem('widajewls-purchase-event-id',purchaseEventId);const metaBrowserIds=getMetaBrowserIds();if(!TURNSTILE_SITE_KEY)throw new Error('Checkout security ){const info=JSON.parse(localStorage.getItem("widajewls-last-order")||"{}");const items=Array.isArray(info.items)?info.items:[];return '<div class="view active">'+header()+'<main class="checkout" style="text-align:center"><div style="font-size:58px;line-height:1;margin-bottom:18px">✓</div><div class="kicker">Order confirmed</div><h1>Thank you for your trust.</h1><p style="color:#777;max-width:590px;margin:0 auto 28px;font-size:15px;line-height:1.7">Your order has been received successfully. We will contact you to confirm the details before shipping.</p><div class="order-box" style="max-width:560px;margin:25px auto;text-align:left"><div class="order-line"><span>Order number</span><b>#'+esc(orderNumber)+'</b></div>'+(info.name?'<div class="order-line"><span>Customer</span><span>'+esc(info.name)+'</span></div>':'')+(items.length?'<div style="padding:12px 0 4px;font-weight:800">Your order</div>'+items.map(i=>'<div class="order-line"><span>'+esc(i.name)+' × '+i.qty+'</span><span>'+money(i.total)+'</span></div>').join(''):'')+(info.subtotal!=null?'<div class="order-line"><span>Subtotal</span><span>'+money(info.subtotal)+'</span></div>':'')+(info.shipping!=null?'<div class="order-line"><span>Delivery</span><span>'+money(info.shipping)+'</span></div>':'')+'<div class="order-line"><span>Total</span><b>'+money(Number(info.total||0))+'</b></div><div class="order-line"><span>Payment</span><span>Cash on delivery</span></div></div><div style="background:#eeece6;border-radius:14px;padding:17px 20px;max-width:560px;margin:0 auto 25px;color:#555;font-size:13px;line-height:1.6">We’ll contact you to confirm your order, then prepare it for delivery.</div><a class="btn" href="#/" onclick="home();return false">Continue shopping</a></main>'+footer()+'</div>'}

function hydrateDeferredStory(){
  const story=document.getElementById("story"),visual=story?.querySelector(".story-visual");
  if(!story||!visual)return;
  const load=()=>{
    const url=window.matchMedia("(max-width:800px)").matches?story.dataset.storyMobile:story.dataset.storyDesktop;
    if(url)visual.style.backgroundImage="url('"+String(url).replace(/'/g,"%27")+"')";
  };
  if("IntersectionObserver" in window){
    const observer=new IntersectionObserver(entries=>{
      if(entries.some(entry=>entry.isIntersecting)){load();observer.disconnect()}
    },{rootMargin:"500px 0px"});
    observer.observe(story);
  }else load();
}

}document.addEventListener("blur",e=>{if(e.target?.matches?.('input[name="phone"]'))validateCheckoutPhone(e.target,false)},true);document.addEventListener("input",e=>{if(e.target?.matches?.('input[name="phone"]')){if(isValidMoroccanPhone(e.target.value))setPhoneFieldError(e.target,false);else if(!String(e.target.value||"").trim())setPhoneFieldError(e.target,false)}});window.addEventListener("hashchange",()=>{resetTurnstile();render();updateSEO();if(location.hash==="#/checkout")setTimeout(renderTurnstile,120)});restoreStorefrontCache();document.addEventListener("click",e=>{if(!e.target.closest(".language-switcher"))closeLanguageMenu()});window.addEventListener("scroll",()=>{const b=document.getElementById("backtop");if(b)b.classList.toggle("show",scrollY>600)});render();syncStorefrontProductImages();updateSEO();setTimeout(renderTurnstile,500);
