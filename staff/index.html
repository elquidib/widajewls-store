<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wida Jewls — Staff Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
:root{--bg:#faf8f3;--ink:#1c1c1c;--muted:#77736c;--line:#e5dccd;--gold:#c9a45c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.login{max-width:420px;margin:12vh auto}.brand{font-family:Georgia,serif;letter-spacing:.14em;font-size:22px}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:750;background:#171717;color:#fff;cursor:pointer}button:disabled{opacity:.5}.primary{background:#171717}.green{background:#18794e}.red{background:#b42318}.soft{background:#f1eadf;color:#171717}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.error{color:#b42318}.hidden{display:none!important}.orders{display:grid;gap:12px}.order h2{font-size:18px;margin:0}.pill{border-radius:99px;padding:5px 9px;background:#f3eadc;font-size:12px;font-weight:800}.status-new{background:#fff2ca}.status-confirmed{background:#e7f2ff}.status-shipped,.status-delivered{background:#e4f5ea}.items{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.item{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.total{font-size:18px;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:105px}.small{font-size:12px}.hidden{display:none!important}@media(min-width:700px){.orders{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="wrap login"><div class="card">
<div class="brand">WIDA✦JEWLS</div><h2>Staff login</h2><p class="muted">Sign in with the username and PIN provided by your manager.</p>
<form id="loginForm"><label>Username</label><input id="username" autocomplete="username" required maxlength="24" placeholder="e.g. sara"><label>6-digit PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" required placeholder="••••••"><button style="width:100%;margin-top:16px">Sign in</button><p id="loginError" class="error"></p></form>
</div></div>
<div id="app" class="wrap hidden">
<div class="card row between"><div><div class="brand">WIDA✦JEWLS</div><div class="muted" id="staffName"></div></div><button class="soft" onclick="logout()">Log out</button></div>
<div class="card"><div class="row between"><div><h2 style="margin:0">Orders</h2><p class="muted" style="margin:5px 0">Only order handling is available in this account.</p></div><button class="soft" onclick="loadOrders()">Refresh</button></div>
<div class="row" style="margin-top:12px"><input id="search" placeholder="Search order, name, phone or city" oninput="renderOrders()" style="flex:2;min-width:190px"><select id="filter" onchange="renderOrders()" style="flex:1;min-width:145px"><option value="">All statuses</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option><option value="returned">Returned</option></select></div></div>
<div id="orders" class="orders"></div><p id="message" class="muted small"></p>
</div>
<script>
const db=supabase.createClient(WIDAJEWLS_SUPABASE.url,WIDAJEWLS_SUPABASE.publishableKey);
let orders=[],busy=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function staffEmail(u){return String(u||'').trim().toLowerCase()+'@staff.widajewls.invalid'}
async function api(payload){const r=await db.functions.invoke('staff-orders',{body:payload});if(r.error)throw new Error(r.error.message||'Request failed');if(r.data?.error)throw new Error(r.data.error);return r.data}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const username=$('username').value.trim().toLowerCase(),pin=$('pin').value;if(!/^[a-z0-9._-]{3,24}$/.test(username)||!/^\d{6}$/.test(pin)){$('loginError').textContent='Enter a valid username and six-digit PIN.';return}const r=await db.auth.signInWithPassword({email:staffEmail(username),password:pin});if(r.error){$('loginError').textContent='Incorrect username or PIN.';return}try{const u=await db.auth.getUser();const p=await db.from('profiles').select('role,full_name').eq('id',u.data.user.id).maybeSingle();if(p.data?.role!=='staff'){await db.auth.signOut();$('loginError').textContent='This login is not a staff account.';return}const check=await api({action:'list_orders'});$('staffName').textContent=p.data.full_name||username;$('login').classList.add('hidden');$('app').classList.remove('hidden');orders=check.orders||[];renderOrders()}catch(err){await db.auth.signOut();$('loginError').textContent=err.message||'Could not sign in.'}};
async function loadOrders(){if(busy)return;busy=true;$('message').textContent='Loading orders...';try{const r=await api({action:'list_orders'});orders=r.orders||[];renderOrders();$('message').textContent='Updated just now.'}catch(e){$('message').textContent=e.message}finally{busy=false}}
function renderOrders(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const rows=orders.filter(o=>(!f||o.status===f)&&[o.order_number,o.customer_name,o.phone,o.city].join(' ').toLowerCase().includes(q));$('orders').innerHTML=rows.map(o=>{const items=(o.order_items||[]).map(i=>'<div class="item"><span>'+esc(i.product_name)+(i.variant_name?' · '+esc(i.variant_name):'')+' × '+esc(i.quantity)+'</span><b>'+Number(i.line_total||0).toFixed(2)+' DH</b></div>').join('');const phone=String(o.phone||'').replace(/[^0-9+]/g,'');return '<article class="card order"><div class="row between"><h2>Order #'+esc(o.order_number)+'</h2><span class="pill status-'+esc(o.status)+'">'+esc(o.status)+'</span></div><p style="margin:9px 0 4px"><b>'+esc(o.customer_name)+'</b></p><div class="muted">'+esc(o.phone)+' · '+esc(o.city||'')+'</div><p style="margin:8px 0">'+esc(o.address||'')+'</p><div class="items">'+(items||'<span class="muted">No item details</span>')+'</div><div class="row between" style="margin-top:12px"><span class="muted">COD total</span><span class="total">'+Number(o.total||0).toFixed(2)+' DH</span></div><div class="actions"><a href="tel:'+esc(phone)+'" style="flex:1;text-decoration:none"><button class="soft" style="width:100%">Call</button></a>'+(o.status==='new'?'<button class="green" onclick="handle(\''+o.id+'\',\'confirm\')">Confirm</button><button class="soft" onclick="handle(\''+o.id+'\',\'call_later\')">Call later</button><button class="red" onclick="handle(\''+o.id+'\',\'cancel\')">Cancel</button>':(o.status==='confirmed'?'<button class="soft" onclick="handle(\''+o.id+'\',\'call_later\')">Call later</button>':''))+'</div></article>'}).join('')||'<div class="card muted">No orders match this filter.</div>'}
async function handle(id,operation){if(busy)return;const labels={confirm:'Confirm this order?',cancel:'Cancel this order?',call_later:'Set a reminder to call this customer in 2 hours?'};if(!confirm(labels[operation]))return;busy=true;$('message').textContent='Saving...';try{await api({action:'handle_order',order_id:id,operation});busy=false;await loadOrders();$('message').textContent='Order updated ✓'}catch(e){$('message').textContent=e.message}finally{busy=false}}
async function logout(){await db.auth.signOut();location.reload()}
(async()=>{const s=await db.auth.getSession();if(s.data.session){const u=await db.auth.getUser();const p=await db.from('profiles').select('role,full_name').eq('id',u.data.user.id).maybeSingle();if(p.data?.role==='staff'){try{const r=await api({action:'list_orders'});$('staffName').textContent=p.data.full_name||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');orders=r.orders||[];renderOrders()}catch{await db.auth.signOut()}}else await db.auth.signOut()}})();
</script>
</body></html>
